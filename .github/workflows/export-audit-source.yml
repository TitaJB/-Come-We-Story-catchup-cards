name: Export audit source

on:
  push:
    branches: [content/audit-v1]
    paths:
      - '.github/workflows/export-audit-source.yml'
      - 'data/questions.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export review-friendly audit files
        run: |
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          source = Path('data/questions.json')
          questions = json.loads(source.read_text(encoding='utf-8'))
          if len(questions) != 750:
              raise SystemExit(f'Expected 750 questions, found {len(questions)}')

          out = Path('audit/source')
          out.mkdir(parents=True, exist_ok=True)

          priority = {
              'Would You Rather',
              'Remove One',
              'Black British Culture',
              'Football & Sport',
          }

          def slug(value):
              return re.sub(r'[^a-z0-9]+', '-', value.lower()).strip('-')

          for category in sorted(priority):
              rows = [q for q in questions if q.get('category') == category]
              path = out / f'{slug(category)}.ndjson'
              path.write_text(
                  '\n'.join(json.dumps(q, ensure_ascii=False) for q in rows) + '\n',
                  encoding='utf-8'
              )

          with (out / 'all-questions.csv').open('w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow(['id','category','question','followUp','intensity','type','tags','energy'])
              for q in questions:
                  writer.writerow([
                      q.get('id',''), q.get('category',''), q.get('question',''),
                      q.get('followUp',''), q.get('intensity',''), q.get('type',''),
                      '|'.join(q.get('tags', [])), q.get('energy','')
                  ])

          print('Exported four priority decks and full inventory')
          PY
      - name: Commit audit source exports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/source
          if git diff --cached --quiet; then
            echo 'Audit exports already current'
          else
            git commit -m 'Export live dataset for content audit [skip ci]'
            git push
          fi
