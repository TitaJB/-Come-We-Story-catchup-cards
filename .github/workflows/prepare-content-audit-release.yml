name: Prepare content audit release

on:
  push:
    branches: [content/audit-v1]
    paths:
      - '.github/workflows/prepare-content-audit-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit files and one-off workflows
        run: |
          rm -rf audit
          rm -f .github/workflows/apply-content-audit-v1.yml
          rm -f .github/workflows/export-audit-source.yml
          rm -f .github/workflows/prepare-content-audit-release.yml
      - name: Commit clean release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Release branch already clean'
          else
            git commit -m 'Remove temporary content-audit files [skip ci]'
            git push
          fi
