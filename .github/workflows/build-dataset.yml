name: Build question dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dataset.yml'
      - 'data/questions-pack-*.json.gz.b64'

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate question packs
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          questions = []
          for number in range(1, 6):
              path = Path(f'data/questions-pack-{number}.json.gz.b64')
              encoded = ''.join(path.read_text(encoding='utf-8').split())
              pack = json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
              if len(pack) != 150:
                  raise SystemExit(f'{path} contains {len(pack)} records instead of 150')
              questions.extend(pack)

          if len(questions) != 750:
              raise SystemExit(f'Expected 750 records, found {len(questions)}')
          if len({item['id'] for item in questions}) != 750:
              raise SystemExit('Question IDs are not unique')
          if len({item['question'] for item in questions}) != 750:
              raise SystemExit('Question text is not unique')

          Path('data/questions.json').write_text(
              json.dumps(questions, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print('Published 750 validated questions')
          PY
      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/questions.json
          if git diff --cached --quiet; then
            echo 'Dataset already current'
          else
            git commit -m 'Publish uncompressed 750-question dataset [skip ci]'
            git push
          fi
