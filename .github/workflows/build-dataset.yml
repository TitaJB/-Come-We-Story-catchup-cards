name: Build question dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dataset.yml'
      - 'data/questions.json'

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full question dataset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/questions.json')
          questions = json.loads(source.read_text(encoding='utf-8'))

          if len(questions) != 750:
              raise SystemExit(f'Expected 750 records, found {len(questions)}')
          if len({item['id'] for item in questions}) != 750:
              raise SystemExit('Question IDs are not unique')
          if len({item['question'] for item in questions}) != 750:
              raise SystemExit('Question text is not unique')

          print('Validated 750-question dataset')
          PY
      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/questions.json
          if git diff --cached --quiet; then
            echo 'Dataset already current'
          else
            git commit -m 'Publish uncompressed 750-question dataset [skip ci]'
            git push
          fi
