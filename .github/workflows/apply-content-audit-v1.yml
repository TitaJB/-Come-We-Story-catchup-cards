name: Apply content audit v1

on:
  push:
    branches: [content/audit-v1]
    paths:
      - '.github/workflows/apply-content-audit-v1.yml'
      - 'audit/revised/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply revised decks and validate library
        run: |
          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          source = Path('data/questions.json')
          questions = json.loads(source.read_text(encoding='utf-8'))

          revised_paths = [
              Path('audit/revised/would-you-rather.json'),
              Path('audit/revised/remove-one.json'),
              Path('audit/revised/hot-takes.json'),
              Path('audit/revised/black-british-culture.json'),
              Path('audit/revised/football-sport.json'),
          ]

          replacements = {}
          for path in revised_paths:
              deck = json.loads(path.read_text(encoding='utf-8'))
              if len(deck) != 50:
                  raise SystemExit(f'{path} must contain exactly 50 cards; found {len(deck)}')
              for card in deck:
                  card_id = card['id']
                  if card_id in replacements:
                      raise SystemExit(f'Duplicate replacement ID: {card_id}')
                  replacements[card_id] = card

          if len(replacements) != 250:
              raise SystemExit(f'Expected 250 audited replacements; found {len(replacements)}')

          existing_ids = {card['id'] for card in questions}
          missing = sorted(set(replacements) - existing_ids)
          if missing:
              raise SystemExit(f'Replacement IDs missing from canonical dataset: {missing}')

          revised = [replacements.get(card['id'], card) for card in questions]

          expected_ids = [f'q{number:04d}' for number in range(1, 751)]
          ids = [card['id'] for card in revised]
          texts = [card['question'] for card in revised]
          counts = Counter(card['category'] for card in revised)

          if len(revised) != 750:
              raise SystemExit(f'Expected 750 cards; found {len(revised)}')
          if ids != expected_ids:
              raise SystemExit('Card IDs are missing, duplicated or out of order')
          if len(set(texts)) != 750:
              raise SystemExit('Question text is not unique')
          if len(counts) != 15 or any(count != 50 for count in counts.values()):
              raise SystemExit(f'Expected 15 categories with 50 cards each; found {dict(counts)}')
          if counts.get('Remove One') != 50 or counts.get('Hot Takes') != 50:
              raise SystemExit(f'Remove One / Hot Takes balance is incorrect: {dict(counts)}')

          source.write_text(
              json.dumps(revised, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )

          cache_updates = {
              Path('sw-v2.js'): 'catchup-cards-v5-content-audit',
              Path('sw.js'): 'catchup-cards-v4-content-audit',
          }
          for path, cache_name in cache_updates.items():
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r"const CACHE=['\"][^'\"]+['\"]",
                  f"const CACHE='{cache_name}'",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not update cache version in {path}')
              if './data/questions.json' not in updated:
                  raise SystemExit(f'{path} does not cache data/questions.json')
              path.write_text(updated, encoding='utf-8')

          print('Applied 250 audited records')
          print('Validated 750 unique cards across 15 categories')
          print(dict(sorted(counts.items())))
          PY

      - name: Commit audited content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/questions.json sw.js sw-v2.js
          if git diff --cached --quiet; then
            echo 'Audited content already current'
          else
            git commit -m 'Apply content audit v1 to 250 prompt cards [skip ci]'
            git push
          fi
